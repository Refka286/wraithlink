services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wraithlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wraithlink}
      POSTGRES_DB: ${POSTGRES_DB:-wraithlink}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wraithlink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wraithlink}:${POSTGRES_PASSWORD:-wraithlink}@postgres:5432/${POSTGRES_DB:-wraithlink}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - evidence_data:/data/evidence

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    cap_add:
      - NET_RAW
      - NET_ADMIN
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wraithlink}:${POSTGRES_PASSWORD:-wraithlink}@postgres:5432/${POSTGRES_DB:-wraithlink}
      REDIS_URL: redis://redis:6379/0
      # the Debian nmap package isn't built with libcap-ng support, so nmap
      # gates raw-socket scan types (-sS) behind an EUID==0 check regardless
      # of actual capability bits - this tells it to trust the CAP_NET_RAW
      # file capability granted on the binary (see backend/Dockerfile) instead
      NMAP_PRIVILEGED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evidence_data:/data/evidence

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  evidence_data:
